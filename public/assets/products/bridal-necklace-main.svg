<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F3EBD3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E8DFC8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E5D7C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B20"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#380914" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#DCD0B5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="300" cy="270" r="210" fill="url(#goldGlow)"/>

  <!-- Bridal Necklace Illustration -->
  <g filter="url(#subtleShadow)" transform="translate(0, 10)">
    <!-- Main Choker Arc -->
    <path d="M 170 210 Q 300 370 430 210" fill="none" stroke="url(#goldMetallic)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 185 220 Q 300 350 415 220" fill="none" stroke="#4A0E1C" stroke-width="3"/>
    <!-- Outer Fringe & Drop Gems -->
    <path d="M 210 255 L 205 285 M 240 280 L 235 320 M 270 300 L 265 345 M 300 308 L 300 365 M 330 300 L 335 345 M 360 280 L 365 320 M 390 255 L 395 285" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round"/>
    <!-- Center Medallion -->
    <circle cx="300" cy="375" r="24" fill="url(#goldMetallic)"/>
    <circle cx="300" cy="375" r="16" fill="#751B30"/>
    <circle cx="300" cy="375" r="7" fill="url(#goldMetallic)"/>
    <circle cx="300" cy="412" r="9" fill="url(#goldMetallic)"/>

    <!-- Matching Earrings -->
    <g transform="translate(140, 140)">
      <circle cx="0" cy="0" r="12" fill="url(#goldMetallic)"/>
      <path d="M 0 12 L 0 32" stroke="url(#goldMetallic)" stroke-width="4"/>
      <circle cx="0" cy="44" r="16" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="44" r="9" fill="#751B30"/>
    </g>
    <g transform="translate(460, 140)">
      <circle cx="0" cy="0" r="12" fill="url(#goldMetallic)"/>
      <path d="M 0 12 L 0 32" stroke="url(#goldMetallic)" stroke-width="4"/>
      <circle cx="0" cy="44" r="16" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="44" r="9" fill="#751B30"/>
    </g>
  </g>

  <!-- Tag & Details -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-140" y="-20" width="280" height="34" rx="17" fill="#4A0E1C" opacity="0.9"/>
    <text y="3" fill="#FAF8F5" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1">22K BRIDAL NECKLACE SET</text>
  </g>
</svg>
