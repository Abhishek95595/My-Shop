<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B20"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#DCD0B5" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Earring & Filigree Close up -->
  <g transform="translate(300, 240)">
    <circle cx="0" cy="-60" r="30" fill="url(#goldMetallic)"/>
    <circle cx="0" cy="-60" r="18" fill="#751B30"/>
    <path d="M 0 -30 L 0 30" stroke="url(#goldMetallic)" stroke-width="8"/>
    <!-- Jhumka Bell -->
    <path d="M -60 40 C -60 120 60 120 60 40 Z" fill="url(#goldMetallic)"/>
    <circle cx="-40" cy="130" r="7" fill="url(#goldMetallic)"/>
    <circle cx="-20" cy="135" r="7" fill="url(#goldMetallic)"/>
    <circle cx="0" cy="140" r="9" fill="url(#goldMetallic)"/>
    <circle cx="20" cy="135" r="7" fill="url(#goldMetallic)"/>
    <circle cx="40" cy="130" r="7" fill="url(#goldMetallic)"/>
  </g>

  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-130" y="-20" width="260" height="34" rx="17" fill="#4A0E1C" opacity="0.9"/>
    <text y="3" fill="#FAF8F5" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1">EARRING &amp; DETAIL VIEW</text>
  </g>
</svg>
