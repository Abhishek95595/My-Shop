<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F3EBD3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E5D7C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B20"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#380914" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#DCD0B5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="300" cy="270" r="180" fill="url(#goldGlow)"/>

  <!-- Ring Showcase -->
  <g filter="url(#subtleShadow)" transform="translate(300, 270)">
    <!-- Ring Band (3D Oval) -->
    <ellipse cx="0" cy="40" rx="110" ry="60" fill="none" stroke="url(#goldMetallic)" stroke-width="24"/>
    <ellipse cx="0" cy="40" rx="90" ry="46" fill="none" stroke="#4A0E1C" stroke-width="2" opacity="0.3"/>
    
    <!-- Top Crown Floral Motif -->
    <g transform="translate(0, -20)">
      <circle cx="0" cy="0" r="32" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="0" r="22" fill="#751B30"/>
      <circle cx="0" cy="0" r="10" fill="url(#goldMetallic)"/>
      <!-- Petals around crown -->
      <circle cx="-32" cy="0" r="12" fill="url(#goldMetallic)"/>
      <circle cx="32" cy="0" r="12" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="-32" r="12" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="32" r="12" fill="url(#goldMetallic)"/>
    </g>
  </g>

  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-130" y="-20" width="260" height="34" rx="17" fill="#4A0E1C" opacity="0.9"/>
    <text y="3" fill="#FAF8F5" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1">22K CLASSIC GOLD RING</text>
  </g>
</svg>
