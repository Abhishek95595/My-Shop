<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F3EBD3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E5D7C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B20"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#380914" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#DCD0B5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="300" cy="270" r="200" fill="url(#goldGlow)"/>

  <!-- Mangalsutra Showcase -->
  <g filter="url(#subtleShadow)">
    <!-- Black and Gold Bead Strands -->
    <path d="M 150 160 Q 300 360 450 160" fill="none" stroke="#261B17" stroke-width="6" stroke-dasharray="10,6"/>
    <path d="M 160 175 Q 300 375 440 175" fill="none" stroke="url(#goldMetallic)" stroke-width="4" stroke-dasharray="8,8"/>
    
    <!-- Traditional Gold Pendant -->
    <g transform="translate(300, 335)">
      <!-- Vati / Cups Shape -->
      <circle cx="-28" cy="0" r="26" fill="url(#goldMetallic)"/>
      <circle cx="-28" cy="0" r="16" fill="#751B30"/>
      <circle cx="28" cy="0" r="26" fill="url(#goldMetallic)"/>
      <circle cx="28" cy="0" r="16" fill="#751B30"/>
      <!-- Floral Center & Drops -->
      <circle cx="0" cy="-6" r="14" fill="url(#goldMetallic)"/>
      <circle cx="-28" cy="38" r="6" fill="url(#goldMetallic)"/>
      <circle cx="0" cy="44" r="8" fill="url(#goldMetallic)"/>
      <circle cx="28" cy="38" r="6" fill="url(#goldMetallic)"/>
    </g>
  </g>

  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-140" y="-20" width="280" height="34" rx="17" fill="#4A0E1C" opacity="0.9"/>
    <text y="3" fill="#FAF8F5" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1">TRADITIONAL MANGALSUTRA</text>
  </g>
</svg>
